    <link rel="stylesheet" href="/app/offline.css" />
    <title>Hourmere — Offline / 离线</title>

  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Reconnect to use Hourmere, then reload this page.</p>
      <p>Bookings and account data aren’t available offline. Changes can’t be saved offline.</p>
      <p><a href="/app/">Try again</a></p>
      <section lang="zh-CN">
        <h2>你已离线</h2>
        <p>请连接网络，然后重新加载此页面以使用 Hourmere。</p>
        <p>离线时无法查看预约和账户数据，也无法保存更改。</p>
        <p><a href="/app/">重试</a></p>
      </section>
    </main>
  </body>
