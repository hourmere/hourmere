# Published image install: select this after docker-compose.yml in COMPOSE_FILE.
# Set an exact release version without v (for example 1.0.0 or 1.0.0-rc.1).
# setup.sh validates the version; never use latest or a floating minor tag.
# The optional worker overlay selects the same image from HOURMERE_VERSION.
services:
  app:
    build: !reset null
    image: ghcr.io/hourmere/hourmere:${HOURMERE_VERSION:?set an exact HOURMERE_VERSION, for example 1.0.0}
    pull_policy: missing
