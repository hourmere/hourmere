# Self-hosting: ./scripts/setup.sh creates a private .env and prints the next commands.
# --image selects docker-compose.image.yml and an exact HOURMERE_VERSION; start without --build.
# --source builds this checkout with docker compose up -d --build --wait.
# The optional docker-compose.proxy.yml adds Caddy HTTPS (selected by setup.sh).
# The app listens on 127.0.0.1:3000; put a reverse proxy with TLS in front of it. Until SMTP
# is configured, sign-in links are printed by `docker compose logs app`. With the default
# SIGNUP=first-user, sign in right after the first start: the first account should be yours.
# Background jobs run inside `app` unless COMPOSE_FILE in .env also selects
# docker-compose.worker.yml, which runs them in a separate worker.
name: hourmere

services:
  app:
    build: .
    # Built here, never pulled; the optional worker overlay runs the same image.
    image: ${APP_IMAGE:-hourmere:local}
    pull_policy: never
    environment:
      # The password stays out of the URL so it may contain any characters (/, #, ?, …);
      # the Postgres client reads PGPASSWORD when the URL has none.
      DATABASE_URL: postgres://hourmere@db:5432/hourmere
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      SUCCESS_REDIRECT_ALLOW_IP_HOSTS: ${SUCCESS_REDIRECT_ALLOW_IP_HOSTS:-false}
      HOSTED_SIGNUP_URL: ${HOSTED_SIGNUP_URL:-https://hourmere.com}
      PRIVACY_POLICY_URL: ${PRIVACY_POLICY_URL:-}
      TERMS_URL: ${TERMS_URL:-}
      EMBED_ALLOWED_ORIGINS: ${EMBED_ALLOWED_ORIGINS:-}
      WEBHOOKS_ENABLED: ${WEBHOOKS_ENABLED:-false}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-}
      WEBHOOK_PRIVATE_TARGETS: ${WEBHOOK_PRIVATE_TARGETS:-}
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (openssl rand -base64 32)}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      BOOKING_MAX_INVITEE_RESCHEDULES: ${BOOKING_MAX_INVITEE_RESCHEDULES:-}
      MAIL_RECIPIENT_MAX_PER_HOUR: ${MAIL_RECIPIENT_MAX_PER_HOUR:-}
      MAIL_RECIPIENT_MAX_PER_DAY: ${MAIL_RECIPIENT_MAX_PER_DAY:-}
      SIGN_IN_MAIL_MAX_PER_HOUR: ${SIGN_IN_MAIL_MAX_PER_HOUR:-}
      SIGN_IN_MAIL_MAX_PER_DAY: ${SIGN_IN_MAIL_MAX_PER_DAY:-}
      INVITATION_INVITER_MAX_PER_HOUR: ${INVITATION_INVITER_MAX_PER_HOUR:-}
      INVITATION_INVITER_MAX_PER_DAY: ${INVITATION_INVITER_MAX_PER_DAY:-}
      INVITATION_TEAM_MAX_PER_HOUR: ${INVITATION_TEAM_MAX_PER_HOUR:-}
      INVITATION_TEAM_MAX_PER_DAY: ${INVITATION_TEAM_MAX_PER_DAY:-}
      MAIL_MAX_PER_HOUR: ${MAIL_MAX_PER_HOUR:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_MEET_ENABLED: ${GOOGLE_MEET_ENABLED:-false}
      ZOOM_MEETINGS_ENABLED: ${ZOOM_MEETINGS_ENABLED:-false}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      MICROSOFT_CALENDAR_CLIENT_ID: ${MICROSOFT_CALENDAR_CLIENT_ID:-}
      MICROSOFT_CALENDAR_CLIENT_SECRET: ${MICROSOFT_CALENDAR_CLIENT_SECRET:-}
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID:-}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET:-}
      ZOOM_WEBHOOK_SECRET_TOKEN: ${ZOOM_WEBHOOK_SECRET_TOKEN:-}
      CONFERENCE_ENCRYPTION_KEY: ${CONFERENCE_ENCRYPTION_KEY:-}
      CALENDAR_ENCRYPTION_KEY: ${CALENDAR_ENCRYPTION_KEY:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      # Who may create an account (see .env.example); empty means first-user.
      SIGNUP: ${SIGNUP:-}
      SIGNUP_ALLOWED_DOMAINS: ${SIGNUP_ALLOWED_DOMAINS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-}
      HTTP_HEADERS_TIMEOUT: ${HTTP_HEADERS_TIMEOUT:-}
      HTTP_REQUEST_TIMEOUT: ${HTTP_REQUEST_TIMEOUT:-}
      HTTP_KEEP_ALIVE_TIMEOUT: ${HTTP_KEEP_ALIVE_TIMEOUT:-}
      HOURMERE_ROLE: ${HOURMERE_ROLE:-}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    # Allow a 10 s HTTP drain, 20 s job drain and 5 s margin before Docker kills it.
    stop_grace_period: 35s
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hourmere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hourmere
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hourmere -d hourmere"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db-data:
