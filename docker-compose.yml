# Self-hosting: copy .env.example to .env, set POSTGRES_PASSWORD, BETTER_AUTH_SECRET and
# PUBLIC_URL (optionally SMTP and Google/Microsoft sign-in), then
#   docker compose up -d
# The app listens on 127.0.0.1:3000; put a reverse proxy with TLS in front of it. Until SMTP
# is configured, sign-in links are printed by `docker compose logs app`. With the default
# SIGNUP=first-user, sign in right after the first start: the first account should be yours.
name: hourmere

services:
  app:
    build: .
    environment:
      # The password stays out of the URL so it may contain any characters (/, #, ?, …);
      # the Postgres client reads PGPASSWORD when the URL has none.
      DATABASE_URL: postgres://hourmere@db:5432/hourmere
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (openssl rand -base64 32)}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      # Who may create an account (see .env.example); empty means first-user.
      SIGNUP: ${SIGNUP:-}
      SIGNUP_ALLOWED_DOMAINS: ${SIGNUP_ALLOWED_DOMAINS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hourmere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hourmere
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hourmere -d hourmere"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db-data:
