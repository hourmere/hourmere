# Optional automatic HTTPS. setup.sh selects both files through COMPOSE_FILE in .env.
# Requires Docker Compose >= 2.24.4 for !reset; the app has NO host port in this mode.
services:
  app:
    ports: !reset []
    environment:
      # Trust this one controlled proxy, never every container/private address.
      TRUSTED_PROXIES: ${PROXY_IP:-172.30.62.2}
    networks:
      default:
      ingress:

  proxy:
    image: caddy:2-alpine
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set an https PUBLIC_URL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      ingress:
        ipv4_address: ${PROXY_IP:-172.30.62.2}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

networks:
  ingress:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.62.0/29}

volumes:
  caddy-data:
  caddy-config:
