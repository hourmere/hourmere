name: Feature request
description: Suggest a new feature or a change to existing behavior.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search existing issues first; if one already covers
        it, add your use case there instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today? Who is affected (people booking, hosts, admins, agents)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like Hourmere to do. For API or agent changes, sketch the request and response.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other ways this could be solved.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to implement this myself (please agree on the approach in this issue before opening a pull request).
          required: false
