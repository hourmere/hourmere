name: Import apply timing probe (temporary)

# Temporary diagnosis for the Cal.com import apply test under CI load; reverted before review.
on:
  push:
    branches: [codex/import-apply-flake]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [alone]
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hourmere
          POSTGRES_PASSWORD: hourmere
          POSTGRES_DB: hourmere
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hourmere -d hourmere"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://hourmere:hourmere@localhost:5432/hourmere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Repeat the file with samplers
        env:
          MODE: ${{ matrix.mode }}
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          nproc
          (
            while :; do
              echo "=== $(date -u +%H:%M:%S.%3N) $(cat /proc/loadavg) | $(head -1 /proc/pressure/cpu 2>/dev/null)"
              top -b -c -n 2 -d 0.5 -w 200 | awk '/^top -/{n++} n==2' | sed -n '3p;8,16p'
              docker exec "$PG_CONTAINER" psql -U hourmere -d postgres -Atc "SELECT pid,datname,state,wait_event_type,wait_event,round(extract(epoch FROM clock_timestamp()-query_start)*1000),left(regexp_replace(query,'\s+',' ','g'),70) FROM pg_stat_activity WHERE state<>'idle' AND pid<>pg_backend_pid() AND backend_type='client backend'" 2>&1 | sed 's/^/PGA /'
            done
          ) > sampler.log 2>&1 &
          sampler=$!
          files=packages/import-calcom/src/apply.test.ts
          if [ "$MODE" = neighbours ]; then
            files="packages/scheduling/src/one-time-links.test.ts $files packages/db/src/scim-identity.test.ts"
          fi
          for i in 1 2 3 4 5 6; do
            echo "RUN $i start $(date -u +%H:%M:%S.%3N)"
            IMPORT_APPLY_PROBE_LOG=$PWD/probe-$i.jsonl npx vitest run $files --maxWorkers=2 --reporter=json --outputFile=run-$i.json > vitest-$i.log 2>&1 || echo "RUN $i exit $?"
            echo "RUN $i end $(date -u +%H:%M:%S.%3N)"
            node -e "const d=require('./run-$i.json');for(const f of d.testResults){console.log('FILE',f.name.split('/').pop(),Math.round(f.endTime-f.startTime),new Date(f.startTime).toISOString());if(f.name.endsWith('apply.test.ts'))for(const a of f.assertionResults)if(a.duration>=1000||a.title.startsWith('supports separate'))console.log('CASE',Math.round(a.duration),a.status,a.title.slice(0,70))}"
            sed 's/^/PROBE /' probe-$i.jsonl
          done
          kill "$sampler" || true
          sed 's/^/SAMPLE /' sampler.log
