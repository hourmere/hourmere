name: Release (npm scaffold, disabled)

on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  # TODO: PR #8 is not merged. Fold this job into its release.yml, require
  # needs: [prepare, ci], and retain its tag/main/changelog/environment checks.
  # Enable only in a separate owner-approved PR after configuring npm ownership,
  # trusted publishing and required reviewers on the release environment.
  publish-cli:
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Require the committed CLI version to match the approved release tag
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("tools/cli/package.json", "utf8"));
            if (version === "0.0.0" || process.env.GITHUB_REF_NAME !== `v${version}`) {
              throw new Error("Commit the approved CLI release version before tagging");
            }
          '
      - run: npm run cli:pack-smoke
      - name: Publish the owner-approved CLI with provenance
        working-directory: tools/cli
        run: npm publish --provenance --access public
