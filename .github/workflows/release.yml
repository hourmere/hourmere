name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  # Serialize publication so two versions cannot race to move the stable aliases.
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'hourmere/hourmere'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # Read the release environment's required-reviewer protection.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Validate the version, main ancestry and changelog
        id: release
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          node scripts/release.ts prepare "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Require a configured owner approval gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/release" > "$RUNNER_TEMP/release-environment.json"
          node scripts/release.ts check-environment "$RUNNER_TEMP/release-environment.json"
      - name: Summarize the release notes for approval
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          {
            printf '%s\n' '## Release notes for approval' '' \
              "- Version: $VERSION" "- Tag: $GITHUB_REF_NAME" \
              "- Commit SHA: $GITHUB_SHA" "- Prerelease: $PRERELEASE" ''
            cat "$NOTES_FILE"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the extracted release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ steps.release.outputs.notes_file }}
          if-no-files-found: error

  ci:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    # Configure required reviewers before the first tag; see docs/releasing.md.
    environment: release
    permissions:
      actions: read # Recheck protection after waiting for owner approval.
      contents: write # Create the GitHub Release.
      packages: write # Publish the image and registry attestations.
      id-token: write # Sign provenance with GitHub's OIDC identity.
      attestations: write # Record the image's build provenance on GitHub.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Revalidate the approved release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          node scripts/release.ts prepare "$GITHUB_REF_NAME" "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/environments/release" > "$RUNNER_TEMP/release-environment.json"
          node scripts/release.ts check-environment "$RUNNER_TEMP/release-environment.json"
      - name: Select image tags
        id: image
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MAJOR_MINOR: ${{ steps.release.outputs.major_minor }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          {
            echo 'tags<<IMAGE_TAGS'
            echo "ghcr.io/hourmere/hourmere:$VERSION"
            if [ "$PRERELEASE" = false ]; then
              echo "ghcr.io/hourmere/hourmere:$MAJOR_MINOR"
              echo 'ghcr.io/hourmere/hourmere:latest'
            fi
            echo IMAGE_TAGS
          } >> "$GITHUB_OUTPUT"
      - name: Sign in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish both architectures
        id: build
        uses: ./.github/actions/release-build
        with:
          push: true
          version: ${{ steps.release.outputs.version }}
          tags: ${{ steps.image.outputs.tags }}
      - name: Attest the published image digest
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/hourmere/hourmere
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Summarize the published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
        run: |
          {
            printf '%s\n' '## Published image' '' \
              "- Digest: $IMAGE_DIGEST" "- Attestation URL: $ATTESTATION_URL" \
              "- Attestation ID: $ATTESTATION_ID" '' '### Pushed tags' '' \
              '```text' "$IMAGE_TAGS" '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create the GitHub Release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          flags=(--latest)
          if [ "$PRERELEASE" = true ]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE" "${flags[@]}"

  # Enable only in a separate owner-approved PR after configuring npm ownership,
  # trusted publishing and required reviewers on the release environment.
  publish-cli:
    needs: [prepare, ci]
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Require the committed CLI version to match the approved release tag
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("tools/cli/package.json", "utf8"));
            if (version === "0.0.0" || process.env.GITHUB_REF_NAME !== `v${version}`) {
              throw new Error("Commit the approved CLI release version before tagging");
            }
          '
      - run: npm run cli:pack-smoke
      - name: Publish the owner-approved CLI with provenance
        working-directory: tools/cli
        run: npm publish --provenance --access public
