name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hourmere
          POSTGRES_PASSWORD: hourmere
          POSTGRES_DB: hourmere
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hourmere -d hourmere"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://hourmere:hourmere@localhost:5432/hourmere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Generated table types match the migrations
        run: npm run db:migrate && npm run db:types -- --verify
      - name: Generated API types match the server's OpenAPI document
        run: npm run api:types && git diff --exit-code -- apps/web/src/api/schema.d.ts
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    env:
      # Deliberately contains URL-special characters: self-hosters' passwords will.
      POSTGRES_PASSWORD: ci/pass#word?with+specials=
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start the self-hosting stack
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health
          curl --fail --silent --show-error http://127.0.0.1:3000/ | grep -q '<title>Hourmere</title>'
      - name: Logs
        if: failure()
        run: docker compose logs
