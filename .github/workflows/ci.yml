name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs the required checks again on main plus the queued pull requests.
  merge_group:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A manual rehearsal on main must not cancel main's ordinary CI (or vice versa).
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The required `check` is split so the unit and integration suite runs in parallel shards.
  # Lint, types, generated files, the build and the CLI tarball do not need the suite.
  check-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hourmere
          POSTGRES_PASSWORD: hourmere
          POSTGRES_DB: hourmere
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hourmere -d hourmere"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://hourmere:hourmere@localhost:5432/hourmere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - name: Generated table types match the migrations
        run: npm run db:migrate && npm run db:types -- --verify
      - name: Generated API types match the server's OpenAPI document
        run: npm run api:types && git diff --exit-code -- apps/web/src/api/schema.d.ts
      - name: Build with a disposable legal publication fixture
        run: |
          legal_source=apps/site/src/data/legal.ts
          legal_original=$(mktemp)
          cp "$legal_source" "$legal_original"
          restore_legal_source() {
            cp "$legal_original" "$legal_source"
            rm -f "$legal_original"
            rm -rf apps/site/dist
          }
          trap restore_legal_source EXIT
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = 'apps/site/src/data/legal.ts'
          const source = readFileSync(path, 'utf8')
          writeFileSync(path, source.replace("'SET_ON_PUBLICATION_DAY'", "'2000-01-01'"))
          NODE
          npm run build
      - name: Inspect and smoke test the standalone npm CLI tarball
        run: npm run cli:pack-smoke
      - name: Validate the draft MCP Registry metadata against the official schema
        run: npm run mcp:registry:validate

  # Each shard has its own PostgreSQL service. Vitest assigns every test file to exactly one
  # shard; the shard count in the matrix and in the command must stay equal. Vitest splits by
  # file path hash, not duration: seven shards keep the slowest one near six minutes of tests.
  check-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hourmere
          POSTGRES_PASSWORD: hourmere
          POSTGRES_DB: hourmere
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hourmere -d hourmere"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://hourmere:hourmere@localhost:5432/hourmere
      HOURMERE_PARITY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || (startsWith(github.ref, 'refs/heads/') && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'origin/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Compare known parity gaps to the event's base, including multi-commit pushes.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      # The runner's Ubuntu mirror is sometimes unreachable for minutes, and retries do not help,
      # so keep the shell's packages in the Actions cache and only reach the mirror on a miss.
      - name: Identify the runner release for the shell package cache
        id: runner-release
        run: echo "id=$(. /etc/os-release && echo "${ID}-${VERSION_ID}")-$(dpkg --print-architecture)" >> "$GITHUB_OUTPUT"
      - name: Restore the deployment-test shell packages
        id: zsh-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/zsh-debs
          key: zsh-debs-${{ steps.runner-release.outputs.id }}
      - name: Install the interactive deployment-test shell
        run: |
          if compgen -G "$HOME/zsh-debs/*.deb" > /dev/null && sudo dpkg -i "$HOME"/zsh-debs/*.deb; then
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y zsh
          rm -rf "$HOME/zsh-debs" && mkdir -p "$HOME/zsh-debs"
          (cd "$HOME/zsh-debs" && apt-get download zsh zsh-common)
      - run: npm test -- --maxWorkers=2 --shard=${{ matrix.shard }}/7
        env:
          HOURMERE_PROXY_INTEGRATION: "1"

  # Keep the branch-protection and merge-queue check name stable. A skipped or cancelled
  # part must not turn this required check into a successful skip.
  check:
    needs: [check-static, check-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      STATIC_RESULT: ${{ needs.check-static.result }}
      TESTS_RESULT: ${{ needs.check-tests.result }}
    steps:
      - name: Require the static checks and every test shard to succeed
        run: test "$STATIC_RESULT" = success && test "$TESTS_RESULT" = success

  n8n-compatibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/n8n-nodes-hourmere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tools/n8n-nodes-hourmere/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  cli-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --audit=false --fund=false
      - name: Pack and install the CLI standalone, then check help and version
        run: npm run cli:pack-smoke
      - name: Run CLI unit tests without PostgreSQL
        run: npm test -- tools/cli/src/cli.test.ts tools/cli/src/package.test.ts --maxWorkers=2

  zapier-compatibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/zapier-hourmere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/zapier-hourmere/.node-version
          cache: npm
          cache-dependency-path: tools/zapier-hourmere/package-lock.json
      - run: npm ci --ignore-scripts --audit=false --fund=false
      - name: Test the Zapier runtime and deployment protections with mocked HTTP on Node 22
        run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: Validate locally without a Zapier account or network checks
        run: npm run validate
      - name: Verify the CLI build artifact against its committed dependency lock
        run: npm run build:verify
      - name: Confirm the verification build left nothing to upload
        run: test ! -e build/build.zip && test ! -e build/source.zip

  docker:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: hourmere-ci-${{ github.run_id }}-${{ github.run_attempt }}
      # The template retains the empty SSO settings used by existing installations.
      COMPOSE_ENV_FILES: .env.example
      # Deliberately contains URL-special characters: self-hosters' passwords will.
      POSTGRES_PASSWORD: ci/pass#word?with+specials=
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start the self-hosting stack
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health
          curl --fail --silent --show-error http://127.0.0.1:3000/ | grep -q '<title>Hourmere</title>'
          curl --fail --silent --show-error http://127.0.0.1:3000/api/v1/instance |
            jq -e '.ssoOidcEnabled == true and .ssoSamlEnabled == true'
          unknown_well_known_status=$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' http://127.0.0.1:3000/.well-known/does-not-exist)
          [ "$unknown_well_known_status" = 404 ] || {
            printf 'Unknown well-known route returned HTTP %s; expected 404\n' "$unknown_well_known_status" >&2
            exit 1
          }
      - name: Smoke test the separate worker overlay
        timeout-minutes: 2
        run: |
          compose_worker() { docker compose -f docker-compose.yml -f docker-compose.worker.yml "$@"; }
          compose_worker config --format json > "$RUNNER_TEMP/worker-compose.json"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const { services } = JSON.parse(readFileSync(process.argv[1], "utf8"));
            assert.equal(services.app.environment.HOURMERE_ROLE, "web");
            assert.equal(services.worker.environment.HOURMERE_ROLE, "worker");
            assert.equal(services.worker.image, services.app.image);
          ' "$RUNNER_TEMP/worker-compose.json"
          # Reuse the built image and this job's disposable db service; no second build.
          compose_worker up -d --no-build --wait --wait-timeout 75
          compose_worker logs --no-color app | grep -q 'queued for a worker'
          compose_worker logs --no-color worker | grep -q 'running jobs'
      - name: Logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.worker.yml logs
      - name: Tear down the self-hosting stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.worker.yml down --remove-orphans

  e2e-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      shard_1: ${{ steps.browser.outputs.shard_1 }}
      shard_2: ${{ steps.browser.outputs.shard_2 }}
      shard_3: ${{ steps.browser.outputs.shard_3 }}
      shard_4: ${{ steps.browser.outputs.shard_4 }}
      shard_5: ${{ steps.browser.outputs.shard_5 }}
      shard_6: ${{ steps.browser.outputs.shard_6 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hourmere
          POSTGRES_PASSWORD: hourmere
          POSTGRES_DB: hourmere
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U hourmere -d hourmere"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HOURMERE_E2E_BOOTSTRAP_URL: postgres://hourmere:hourmere@localhost:5432/hourmere
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify the existing Chrome installation
        run: google-chrome --version
      - run: npm ci --ignore-scripts --audit=false --fund=false
      - run: npm run build --workspace @hourmere/web
      - name: Build a disposable site fixture and run browser regressions
        id: browser
        env:
          HOURMERE_E2E_SHARD: ${{ matrix.shard }}
        run: |
          legal_source=apps/site/src/data/legal.ts
          legal_original=$(mktemp)
          cp "$legal_source" "$legal_original"
          restore_legal_source() {
            cp "$legal_original" "$legal_source"
            rm -f "$legal_original"
            rm -rf apps/site/dist
          }
          trap restore_legal_source EXIT
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = 'apps/site/src/data/legal.ts'
          const source = readFileSync(path, 'utf8')
          writeFileSync(path, source.replace("'SET_ON_PUBLICATION_DAY'", "'2000-01-01'"))
          NODE
          npm run build --workspace @hourmere/site
          npm run test --workspace @hourmere/e2e -- --shard=${{ matrix.shard }}/6
      - run: npm run test:e2e:privacy

  # Keep the branch-protection and merge-queue check name stable. A skipped or
  # cancelled shard must not turn this required check into a successful skip.
  e2e:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SHARD_RESULT: ${{ needs.e2e-shard.result }}
      SHARD_COUNTS: ${{ toJSON(needs.e2e-shard.outputs) }}
      SHARD_COUNT: "6"
    steps:
      - name: Require successful and complete browser shards
        run: |
          test "$SHARD_RESULT" = success
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const counts = JSON.parse(process.env.SHARD_COUNTS);
          const shardCount = Number(process.env.SHARD_COUNT);
          assert.ok(Number.isSafeInteger(shardCount) && shardCount > 1, 'Invalid browser shard count');
          let total;
          let selected = 0;
          for (let shard = 1; shard <= shardCount; shard++) {
            const match = /^([1-9]\d*):([1-9]\d*)$/.exec(counts[`shard_${shard}`]);
            assert.ok(match, `Missing or invalid test count for shard ${shard}`);
            const [, shardSelected, shardTotal] = match.map(Number);
            total ??= shardTotal;
            assert.equal(shardTotal, total, `Shard ${shard} discovered a different full suite size`);
            const expected = total / shardCount;
            const tolerance = Math.max(2, Math.ceil(expected / 10));
            assert.ok(Math.abs(shardSelected - expected) <= tolerance,
              `Shard ${shard} selected ${shardSelected}/${total} tests, expected about ${expected.toFixed(1)}`);
            selected += shardSelected;
          }
          assert.equal(selected, total, 'The shard counts must add up to the full suite size');
          console.log(`Selected ${selected} tests across ${shardCount} shards`);
          NODE
