name: Release n8n community node

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Use the one-time npm token for the first package version
        type: boolean
        default: false

permissions: {}

concurrency:
  group: n8n-npm-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'hourmere/hourmere' && github.ref_type == 'tag' && startsWith(github.ref_name, 'n8n-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha512: ${{ steps.pack.outputs.sha512 }}
      sha1: ${{ steps.pack.outputs.sha1 }}
    defaults:
      run:
        shell: bash
        working-directory: tools/n8n-nodes-hourmere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Require the version tag and changelog on main
        run: node scripts/check-release.mjs
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Pack and verify the exact release tarball
        id: pack
        env:
          HOURMERE_N8N_PUBLISH: "1"
        run: |
          node scripts/pack-smoke.mjs "$RUNNER_TEMP/hourmere-n8n-release.tgz"
          sha512=$(shasum -a 512 "$RUNNER_TEMP/hourmere-n8n-release.tgz" | cut -d ' ' -f 1)
          sha1=$(shasum -a 1 "$RUNNER_TEMP/hourmere-n8n-release.tgz" | cut -d ' ' -f 1)
          printf 'sha512=%s\nsha1=%s\n' "$sha512" "$sha1" >> "$GITHUB_OUTPUT"
          printf 'Verified n8n-nodes-hourmere tarball for `%s`\n\n- SHA-512 `%s`\n- SHA-1 `%s`\n' \
            "$GITHUB_REF_NAME" "$sha512" "$sha1" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the verified tarball as a single file
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hourmere-n8n-release.tgz
          path: ${{ runner.temp }}/hourmere-n8n-release.tgz
          archive: false
          if-no-files-found: error
          overwrite: true

  stage:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: n8n-npm-release
    permissions:
      actions: read
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      # GitHub can create a missing environment with no protection rules.
      - name: Require reviewers and restrict the environment to release tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          environment=repos/hourmere/hourmere/environments/n8n-npm-release
          gh api "$environment" | jq -e '
            any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | arrays | length > 0)) and
            .can_admins_bypass == false and
            .deployment_branch_policy.custom_branch_policies == true and
            .deployment_branch_policy.protected_branches == false
          ' > /dev/null || { echo 'Require reviewers, disable admin bypass and select custom deployment policies.' >&2; exit 1; }
          gh api "$environment/deployment-branch-policies" | jq -e '
            .total_count == 1 and
            (.branch_policies | arrays | map({name, type})) == [{name: "n8n-v*", type: "tag"}]
          ' > /dev/null || { echo 'Configure n8n-v* as the only deployment tag policy.' >&2; exit 1; }
      - name: Download the build tarball by artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/n8n-artifact
          skip-decompress: true
      - name: Verify the downloaded tarball against the build SHA-512
        env:
          BUILD_SHA512: ${{ needs.build.outputs.sha512 }}
        run: |
          sha512=$(shasum -a 512 "$RUNNER_TEMP/n8n-artifact/hourmere-n8n-release.tgz" | cut -d ' ' -f 1)
          test "$sha512" = "$BUILD_SHA512" || { echo 'The tarball SHA-512 differs from the build output.' >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require the version tag and changelog on main
        run: node tools/n8n-nodes-hourmere/scripts/check-release.mjs
      - name: Stage the verified tarball with npm provenance
        working-directory: ${{ runner.temp }}
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
          NODE_AUTH_TOKEN: ${{ inputs.bootstrap && secrets.N8N_NPM_BOOTSTRAP_TOKEN || '' }}
        run: |
          if [[ "$BOOTSTRAP" == true ]]; then
            test "$GITHUB_REF" = refs/tags/n8n-v0.1.0
            test -n "$NODE_AUTH_TOKEN" || { echo 'Configure the one-time npm stage token.' >&2; exit 1; }
            status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
              https://registry.npmjs.org/n8n-nodes-hourmere)
            test "$status" = 404 || { echo 'Bootstrap requires an unclaimed package name.' >&2; exit 1; }
          fi
          npm stage publish "$RUNNER_TEMP/n8n-artifact/hourmere-n8n-release.tgz" --registry=https://registry.npmjs.org/ --provenance --access public --ignore-scripts
