# Local development database only (npm run db:up). Self-hosting uses docker-compose.yml.
name: hourmere-dev

services:
  db:
    image: postgres:18-alpine
    # The test suite creates a throwaway database per test file and runs files in parallel;
    # a full run peaks near Postgres's default of 100 connections.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: hourmere
      POSTGRES_PASSWORD: hourmere
      POSTGRES_DB: hourmere
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hourmere -d hourmere"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  db-data:
