# Optional separate worker. Run ./scripts/enable-worker.sh after setup.sh, then follow its
# verification and start commands: image installs omit --build; source installs include --build.
# Manual example: COMPOSE_FILE='docker-compose.yml:docker-compose.proxy.yml:docker-compose.worker.yml'
# Preserve docker-compose.image.yml in the file list for an image install.
# The overlay selects both roles so only the worker runs background jobs.
services:
  app:
    environment:
      HOURMERE_ROLE: web

  worker:
    # Extend the base app directly so the proxy overlay's ingress network is not inherited.
    extends:
      file: docker-compose.yml
      service: app
    # An image install reuses the exact release image pulled for app. Source
    # installs leave HOURMERE_VERSION unset, retain APP_IMAGE/hourmere:local and
    # never pull a local build. App pulls a shared release image before creation.
    image: ${HOURMERE_VERSION:+ghcr.io/hourmere/hourmere:}${HOURMERE_VERSION:-${APP_IMAGE:-hourmere:local}}
    build: !reset null
    environment:
      HOURMERE_ROLE: worker
    # A worker only answers its image health check; never publish its port.
    ports: !reset []
    networks:
      default:
